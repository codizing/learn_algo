<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="#9db7f8" />
  
  <!-- Outer Outline Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#131e3a" stroke-width="3" />
  
  <!-- Laptop Illustration -->
  <!-- Screen Outline -->
  <rect x="88" y="70" width="46" height="34" rx="2" fill="#9db7f8" stroke="#131e3a" stroke-width="2.5" />
  <!-- Screen Inner Line -->
  <rect x="92" y="74" width="38" height="26" rx="1" fill="#9db7f8" stroke="#131e3a" stroke-width="1.5" />
  <!-- Laptop Base -->
  <path d="M82 104 L140 104 L142 108 L80 108 Z" fill="#9db7f8" stroke="#131e3a" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Book Illustration (in front of laptop) -->
  <!-- Left Page -->
  <path d="M60 84 C70 82 82 85 82 90 L82 114 C82 110 70 106 60 108 Z" fill="#ffffff" stroke="#131e3a" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Page -->
  <path d="M104 84 C94 82 82 85 82 90 L82 114 C82 110 94 106 104 108 Z" fill="#ffffff" stroke="#131e3a" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Book Text Lines (Left) -->
  <line x1="65" y1="89" x2="78" y2="90" stroke="#131e3a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="65" y1="94" x2="78" y2="95" stroke="#131e3a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="65" y1="99" x2="78" y2="100" stroke="#131e3a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="65" y1="104" x2="78" y2="105" stroke="#131e3a" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Book Text Lines (Right) -->
  <line x1="86" y1="90" x2="99" y2="89" stroke="#131e3a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="86" y1="95" x2="99" y2="94" stroke="#131e3a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="86" y1="100" x2="99" y2="99" stroke="#131e3a" stroke-width="1.5" stroke-linecap="round" />
  <line x1="86" y1="105" x2="99" y2="104" stroke="#131e3a" stroke-width="1.5" stroke-linecap="round" />

  <!-- Center Text -->
  <text x="100" y="136" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="11.5" fill="#131e3a" letter-spacing="0.2">Study info with Mr</text>
